<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Xưởng Nhà — góc tự làm</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<style>
:root{
  --bg:#0b0f14; --bg2:#0e141b; --card:#111820; --card2:#16202b; --line:#23303d;
  --tx:#e8edf2; --tx2:#9aabb9; --tx3:#70869a;
  --acc:#37d6c4; --acc2:#1e9a8d; --warn:#ffb545; --bad:#ff7b7b; --vio:#8b6cff;
  --on-acc:#06211e; --shadow:0 6px 24px rgba(0,0,0,.35);
}
body.light{
  --bg:#f5f7f9; --bg2:#eef1f5; --card:#ffffff; --card2:#f4f7fa; --line:#dfe5ec;
  --tx:#16202b; --tx2:#4e5e6a; --tx3:#67757f;
  --acc:#0d8d80; --acc2:#0a6f66; --warn:#b26a12; --bad:#c93f36; --vio:#5c43c4;
  --on-acc:#ffffff; --shadow:0 6px 20px rgba(20,40,60,.10);
}
body.light .card{box-shadow:0 1px 2px rgba(20,40,60,.04)}
body.light .chip.warn{border-color:#e6c79a}
body.light .badge,body.light .xbtn{background:rgba(0,0,0,.55)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
@keyframes slideup{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#root{max-width:640px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative}
.wrap{padding:0 16px calc(102px + env(safe-area-inset-bottom))}
.hd{position:sticky;top:0;z-index:20;background:var(--bg);padding:15px 16px 11px;
  border-bottom:1px solid var(--line)}
.hd h1{font-size:21px;font-weight:600;letter-spacing:-.35px}
.hd p{font-size:12.5px;color:var(--tx3);margin-top:3px;line-height:1.45}
.seg{display:flex;gap:6px;margin-top:11px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--tx2);
  padding:6px 13px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:12px;
  animation:fadein .18s ease both}
.card h3{font-size:15.5px;font-weight:600;letter-spacing:-.15px}
.pcard:active{transform:scale(.987)}
.card.pcard{transition:transform .12s ease}
.muted{color:var(--tx2);font-size:13px}
.tiny{color:var(--tx3);font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{background:var(--acc);color:var(--on-acc);border:none;border-radius:12px;padding:12px 16px;
  font:inherit;font-weight:600;font-size:14px;cursor:pointer;width:100%;min-height:44px;
  transition:transform .1s ease,opacity .12s ease}
.btn.ghost{background:transparent;color:var(--tx2);border:1px solid var(--line)}
.btn.sm{width:auto;padding:7px 12px;font-size:13px;border-radius:10px}
.btn:active{transform:scale(.99)}
.chip{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:999px;
  background:var(--card2);border:1px solid var(--line);color:var(--tx2)}
.chip.acc{color:var(--acc);border-color:var(--acc2)}
.chip.warn{color:var(--warn);border-color:#6b4c17}
.chip.ok{color:var(--acc);border-color:var(--acc2)}
.chip.tap{cursor:pointer}
.chip.tap:active{background:var(--acc);color:var(--on-acc)}
.seg2{display:flex;gap:0;margin-top:11px;background:var(--card2);border:1px solid var(--line);
  border-radius:12px;padding:3px}
.seg2 button{flex:1;background:none;border:none;color:var(--tx2);font:inherit;font-size:13.5px;
  font-weight:600;padding:7px 0;border-radius:9px;cursor:pointer}
.seg2 button.on{background:var(--acc);color:var(--on-acc)}
.hero{border-color:var(--acc2);background:linear-gradient(160deg,var(--card2),var(--card) 62%);cursor:pointer}
.secttl{font:600 12.5px "Segoe UI",sans-serif;color:var(--tx3);letter-spacing:.05em;
  text-transform:uppercase;margin:22px 2px 2px}
.focus{position:fixed;inset:0;z-index:70;background:var(--bg);max-width:640px;margin:0 auto;
  display:flex;flex-direction:column}
.fhd{padding:12px 16px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.dots{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.dt{width:100%;flex:1;min-width:8px;height:6px;border-radius:99px;background:var(--card2);
  border:1px solid var(--line);cursor:pointer}
.dt.ok{background:var(--acc2);border-color:var(--acc2)}
.dt.cur{background:var(--acc);border-color:var(--acc);height:8px;margin-top:-1px}
.fbody{flex:1;overflow-y:auto;padding:18px 16px 20px;-webkit-overflow-scrolling:touch}
.ftitle{font-size:24px;font-weight:600;line-height:1.25;margin-top:6px;letter-spacing:-.3px}
.fdesc{font-size:16.5px;line-height:1.62;color:var(--tx2);margin-top:12px}
.fnav{flex:0 0 auto;display:flex;gap:8px;padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--bg2)}
.fnav .btn{padding:13px 10px}
.fnav .btn:disabled{opacity:.32}
.fltrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;align-items:center}
.fchip{background:var(--card);border:1px solid var(--line);color:var(--tx2);font:inherit;font-size:12.5px;
  padding:6px 12px;border-radius:999px;cursor:pointer}
.fchip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:600}
.fsel{width:auto;flex:1;min-width:132px;font-size:12.5px;padding:6px 9px;border-radius:999px;color:var(--tx2)}
.numdot{flex:0 0 23px;height:23px;border-radius:99px;background:var(--card2);border:1px solid var(--line);
  color:var(--acc);font:600 12px/1 "Segoe UI",sans-serif;display:flex;align-items:center;
  justify-content:center;margin-top:2px}
body.light .chip.warn{border-color:#e2c48f}
.pcard{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.thumb{flex:0 0 74px;height:74px;border-radius:13px;background:var(--card2);
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb svg{width:100%;height:100%}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.bar{height:5px;background:var(--card2);border-radius:99px;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--bg2);border-top:1px solid var(--line);
  display:flex;max-width:640px;margin:0 auto;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--tx3);font:inherit;font-size:10.5px;
  min-height:54px;padding:9px 2px 8px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:3px;transition:color .14s ease}
nav button.on{color:var(--acc)}
nav button.on svg{transform:translateY(-1px)}
nav svg{transition:transform .16s ease}
nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);max-width:640px;margin:0 auto;
  overflow-y:auto;-webkit-overflow-scrolling:touch;animation:slideup .2s ease both}
.shd{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.back{background:none;border:none;color:var(--acc);font:inherit;font-size:14px;cursor:pointer;padding:0;margin-bottom:6px}
.step{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:none}
.tick{flex:0 0 28px;height:28px;border-radius:9px;border:1.6px solid var(--line);background:var(--card2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;
  transition:background .13s ease,border-color .13s ease}
.tick:active{transform:scale(.92)}
.tick.on{background:var(--acc);border-color:var(--acc)}
.tick svg{width:15px;height:15px;stroke:var(--on-acc);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.sn{font:600 12px/1 Consolas,monospace;color:var(--acc);letter-spacing:.06em}
.fig{margin:10px 0 2px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px}
.fig svg{display:block;width:100%;height:auto}
.mat{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.mat:last-child{border-bottom:none}
input,textarea,select{background:var(--card2);border:1px solid var(--line);color:var(--tx);
  border-radius:10px;padding:9px 11px;font:inherit;font-size:14px;width:100%}
textarea{resize:vertical;min-height:60px}
input:focus,textarea:focus{outline:none;border-color:var(--acc)}
label.fl{display:block;font-size:12px;color:var(--tx3);margin:0 0 5px 2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:11px 12px}
.kpi b{display:block;font-size:20px;font-weight:600;color:var(--acc);font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--tx3);display:block;margin-top:2px;line-height:1.35}
.warnbox{background:rgba(255,123,123,.07);border:1px solid rgba(255,123,123,.28);border-radius:13px;padding:11px 13px;margin-top:10px}
.warnbox h4{color:var(--bad);font-size:13.5px;font-weight:600;margin-bottom:3px}
.warnbox p{font-size:12.5px;color:var(--tx2);line-height:1.5}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.gal figure{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  position:relative;cursor:pointer}
.badge{position:absolute;top:7px;left:7px;background:rgba(0,0,0,.62);color:#fff;font-size:10.5px;
  padding:3px 8px;border-radius:99px;letter-spacing:.02em}
.slot{position:relative;background:var(--card2);border:1px dashed var(--line);border-radius:12px;
  overflow:hidden;min-height:104px;display:flex}
.slot img{width:100%;height:104px;object-fit:cover;display:block}
.pick{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  cursor:pointer;color:var(--tx3);font:600 12px "Segoe UI",sans-serif;letter-spacing:.06em}
.xbtn{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.6);color:#fff;border:none;
  width:24px;height:24px;border-radius:99px;cursor:pointer;font-size:13px;line-height:1}
.gal img{width:100%;height:118px;object-fit:cover;display:block}
.gal figcaption{padding:9px 10px;font-size:12px;color:var(--tx2)}
.empty{text-align:center;color:var(--tx3);font-size:13.5px;padding:36px 20px;line-height:1.6}
.dot{width:5px;height:5px;border-radius:99px;background:var(--tx3);display:inline-block;vertical-align:middle;margin:0 6px}
</style>
</head>
<body>
<div id="root"></div>
<div id="boot" style="padding:40px 20px;font:15px system-ui;color:#93a4b3">Đang tải…</div>
<script>
  (function(){
    setTimeout(function(){
      var b=document.getElementById('boot'); if(!b) return;
      var miss=[]; if(!window.React) miss.push('React'); if(!window.ReactDOM) miss.push('ReactDOM');
      if(miss.length) b.innerHTML='<b style="color:#ff7b7b">Không tải được thư viện: '+miss.join(', ')+'</b><br><br>Cần Internet lần đầu để lấy React từ jsDelivr.';
      else if(document.getElementById('root').children.length===0) b.innerHTML='<b style="color:#ff7b7b">Ứng dụng không khởi động được.</b><br><br>Mở DevTools (F12) → Console để xem lỗi.';
    },2500);
    /* chưa chọn bao giờ thì theo cài đặt của máy */
    try{
      var t=localStorage.getItem('diy.theme');
      var sang = t ? JSON.parse(t)==='light'
                   : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
      if(sang) document.body.classList.add('light');
    }catch(e){}
    /* Service worker chỉ đăng ký khi trang chạy qua http/https.
       Mở bằng file:// thì trình duyệt chặn, và đó là chuyện bình thường. */
    if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('sw.js').catch(function(){});
      });
    }
  })();
</script>
<!--@@APP@@-->
</body>
</html>
